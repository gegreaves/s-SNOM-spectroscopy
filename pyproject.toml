[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s-SNOM-spectroscopy"
version = "0.1.0"
description = "Tools for s-SNOM spectroscopy data analysis using data from neaSNOM"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]